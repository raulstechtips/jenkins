# Later units enable their own features in this complete wrapper fixture.
infisical:
  authRef: {name: fake-auth, namespace: fake-auth-namespace}
  projectSlug: fake-project
  environmentSlug: fake-env
  push:
    hostAPI: https://infisical.example.test/api
    credentialsRef: {name: fake-credentials, namespace: fake-auth-namespace}
oidc:
  enabled: true
  issuer: https://identity.example.test/realms/fake
  scopes: "openid profile email"
  secretPath: /jenkins/oidc
  adminGroup: jenkins-admins
  userGroup: jenkins-users
github:
  enabled: true
  secretPath: /jenkins/github
  credentialId: github-app
escapeHatch:
  pushToInfisical: true
  secretPath: /jenkins/admin
additionalSecrets:
  - name: fake-user-password
    secretPath: /jenkins/fake-user-password
    keys: {username: FAKE_USERNAME, password: FAKE_PASSWORD}
    jenkinsCredential:
      type: usernamePassword
      description: Fake user credential for chart tests
      scope: global
  - name: fake-external-cluster
    secretPath: /jenkins/fake-external-cluster
    keys: {filename: FAKE_FILENAME, data: FAKE_FILE_DATA}
    jenkinsCredential:
      type: secretFile
      description: Fake external cluster file for chart tests
      scope: system
uiRoute:
  enabled: true
  host: jenkins-ui.example.test
  tlsSecretName: fake-ui-tls
  entryPoints: [websecure]
  ingressClass: traefik-external
  middlewares: [{name: default-headers, namespace: default}]
webhookRoute:
  enabled: true
  host: jenkins.example.test
  tlsSecretName: fake-webhook-tls
  entryPoints: [websecure]
  ingressClass: traefik-external
  middlewares: [{name: default-headers, namespace: default}]
  ipStrategyDepth: 1
  githubHookSourceRanges:
    - 9.234.106.48/28
    - 9.234.98.160/28
    - 9.234.98.176/28
    - 192.30.252.0/22
    - 185.199.108.0/22
    - 140.82.112.0/20
    - 143.55.64.0/20
    - 2a0a:a440::/29
    - 2606:50c0::/32
  additionalHookSourceRanges: []
deployNamespaces: [a, b]
sharedLibraries:
  - name: fake-library
    repo: https://github.com/example/fake-library.git
organizationFolders:
  - name: fake-organization
    owner: example
jenkins: {}
