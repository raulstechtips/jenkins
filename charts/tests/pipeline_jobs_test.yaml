suite: Manual Pipeline jobs
templates:
  - templates/jcasc.yaml
release:
  name: jenkins
  namespace: jenkins
tests:
  - it: renders a standalone SCM job without an organization folder or automatic trigger
    set:
      pipelineJobs:
        - name: update-infisical-auth
          repo: https://github.com/example/platform-operations.git
          branch: feature/DEVSECOPS-62
          scriptPath: pipelines/update-infisical-auth.Jenkinsfile
    documentIndex: 1
    asserts:
      - equal:
          path: metadata.name
          value: jenkins-jcasc-jobs
      - equal:
          path: data["jobs.yaml"]
          value: |-
            jobs:
              - script: |
                  pipelineJob('update-infisical-auth') {
                    definition {
                      cpsScm {
                        scm {
                          git {
                            remote {
                              url('https://github.com/example/platform-operations.git')
                              credentials('github-app')
                            }
                            branch('feature/DEVSECOPS-62')
                          }
                        }
                        scriptPath('pipelines/update-infisical-auth.Jenkinsfile')
                        lightweight()
                      }
                    }
                  }

  - it: includes organization folders and manual jobs in the same jobs configuration
    values:
      - ../ci/all-on-values.yaml
    set:
      pipelineJobs:
        - name: update-infisical-auth
          repo: https://github.com/example/platform-operations.git
          branch: main
          scriptPath: pipelines/update-infisical-auth.Jenkinsfile
    documentIndex: 3
    asserts:
      - matchRegex:
          path: data["jobs.yaml"]
          pattern: "organizationFolder\\('fake-organization'\\)"
      - matchRegex:
          path: data["jobs.yaml"]
          pattern: "pipelineJob\\('update-infisical-auth'\\)"

  - it: escapes quotes in SCM configuration
    set:
      pipelineJobs:
        - name: manual-job
          repo: "https://github.com/example/it's.git"
          branch: "feature/it's"
          scriptPath: "pipelines/it's.Jenkinsfile"
    documentIndex: 1
    asserts:
      - matchRegex:
          path: data["jobs.yaml"]
          pattern: "it's"
        not: true
