suite: Infisical secret pulls
templates:
  - templates/infisical-secrets.yaml
tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders only OIDC with literal remote key templates
    release:
      namespace: jenkins
    set:
      oidc.enabled: true
      oidc.secretPath: /custom/oidc
      infisical.authRef: {name: fake-auth, namespace: fake-auth-namespace}
      infisical.projectSlug: fake-project
      infisical.environmentSlug: fake-env
    asserts:
      - hasDocuments:
          count: 1
      - isAPIVersion:
          of: secrets.infisical.com/v1beta1
      - isKind:
          of: InfisicalStaticSecret
      - equal:
          path: metadata
          value: {name: jenkins-oidc, namespace: jenkins}
      - equal:
          path: spec.infisicalAuthRef
          value: {name: fake-auth, namespace: fake-auth-namespace}
      - equal:
          path: spec.syncOptions.refreshInterval
          value: 60s
      - equal:
          path: spec.sources
          value:
            - {projectSlug: fake-project, environmentSlug: fake-env, secretPath: /custom/oidc}
      - equal:
          path: spec.targets[0]
          value:
            name: jenkins-oidc
            namespace: jenkins
            kind: Secret
            creationPolicy: Owner
            metadata: {annotations: {}, labels: {}}
            template:
              engineVersion: v1
              data:
                clientId: "{{ .OIDC_CLIENT_ID.Value }}"
                clientSecret: "{{ .OIDC_CLIENT_SECRET.Value }}"

  - it: renders only GitHub without credentials provider labels
    set:
      github.enabled: true
      github.secretPath: /custom/github
      infisical.authRef: {name: fake-auth, namespace: fake-auth-namespace}
      infisical.projectSlug: fake-project
      infisical.environmentSlug: fake-env
    asserts:
      - hasDocuments:
          count: 1
      - equal:
          path: metadata.name
          value: jenkins-github
      - equal:
          path: spec.sources[0].secretPath
          value: /custom/github
      - equal:
          path: spec.targets[0].name
          value: jenkins-github
      - equal:
          path: spec.targets[0].metadata
          value: {annotations: {}, labels: {}}
      - equal:
          path: spec.targets[0].template.data
          value:
            appId: "{{ .GITHUB_APP_ID.Value }}"
            privateKey: "{{ .GITHUB_APP_PRIVATE_KEY.Value }}"
            webhookSecret: "{{ .GITHUB_WEBHOOK_SECRET.Value }}"

  - it: renders four pulls with usernamePassword and secretFile credentials
    values:
      - ../ci/all-on-values.yaml
    asserts:
      - hasDocuments:
          count: 4
      - equal:
          path: metadata.name
          value: fake-user-password
        documentIndex: 2
      - equal:
          path: spec.targets[0].metadata
          value:
            annotations:
              jenkins.io/credentials-description: Fake user credential for chart tests
            labels:
              jenkins.io/credentials-type: usernamePassword
              jenkins.io/credentials-scope: global
        documentIndex: 2
      - equal:
          path: spec.targets[0].template.data
          value:
            username: "{{ .FAKE_USERNAME.Value }}"
            password: "{{ .FAKE_PASSWORD.Value }}"
        documentIndex: 2
      - equal:
          path: metadata.name
          value: fake-external-cluster
        documentIndex: 3
      - equal:
          path: spec.targets[0].metadata
          value:
            annotations:
              jenkins.io/credentials-description: Fake external cluster file for chart tests
            labels:
              jenkins.io/credentials-type: secretFile
              jenkins.io/credentials-scope: system
        documentIndex: 3
      - equal:
          path: spec.targets[0].template.data
          value:
            filename: "{{ .FAKE_FILENAME.Value }}"
            data: "{{ .FAKE_FILE_DATA.Value }}"
        documentIndex: 3

  - it: supports additional pulls without credentials metadata and without a scope
    set:
      infisical.authRef: {name: fake-auth, namespace: fake-auth-namespace}
      infisical.projectSlug: fake-project
      infisical.environmentSlug: fake-env
      additionalSecrets:
        - name: plain-secret
          secretPath: /plain
          keys: {token: TOKEN}
        - name: text-secret
          secretPath: /text
          keys: {text: TEXT}
          jenkinsCredential: {type: secretText, description: Fake text}
        - name: app-secret
          secretPath: /app
          keys: {appID: APP_ID, privateKey: APP_KEY}
          jenkinsCredential: {type: gitHubApp, description: Fake app}
    asserts:
      - hasDocuments:
          count: 3
      - equal:
          path: spec.targets[0].metadata
          value: {annotations: {}, labels: {}}
        documentIndex: 0
      - equal:
          path: spec.targets[0].template.data.token
          value: "{{ .TOKEN.Value }}"
        documentIndex: 0
      - equal:
          path: spec.targets[0].metadata
          value:
            annotations:
              jenkins.io/credentials-description: Fake text
            labels:
              jenkins.io/credentials-type: secretText
        documentIndex: 1
      - equal:
          path: spec.targets[0].template.data.text
          value: "{{ .TEXT.Value }}"
        documentIndex: 1
      - equal:
          path: spec.targets[0].template.data
          value:
            appID: "{{ .APP_ID.Value }}"
            privateKey: "{{ .APP_KEY.Value }}"
        documentIndex: 2

  - it: requires the pull authentication name
    set:
      oidc.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: infisical.authRef.name is required when secret pulls are enabled

  - it: requires the pull authentication namespace
    set:
      github.enabled: true
      infisical.authRef.name: fake-auth
    asserts:
      - failedTemplate:
          errorMessage: infisical.authRef.namespace is required when secret pulls are enabled

  - it: requires the pull project
    set:
      additionalSecrets:
        - {name: plain-secret, secretPath: /plain, keys: {token: TOKEN}}
      infisical.authRef: {name: fake-auth, namespace: fake-auth-namespace}
    asserts:
      - failedTemplate:
          errorMessage: infisical.projectSlug is required when secret pulls are enabled

  - it: requires the pull environment
    set:
      oidc.enabled: true
      infisical.authRef: {name: fake-auth, namespace: fake-auth-namespace}
      infisical.projectSlug: fake-project
    asserts:
      - failedTemplate:
          errorMessage: infisical.environmentSlug is required when secret pulls are enabled
