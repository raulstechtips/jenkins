suite: Generic and deployer pod templates
templates:
  - charts/jenkins/templates/jcasc-config.yaml
release:
  name: jenkins
  namespace: jenkins
tests:
  - it: keeps generic work on a NORMAL template without a service account token
    asserts:
      - isKind:
          of: ConfigMap
      - matchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: '(?s)- name: "generic".*?label: "jenkins-jenkins-agent generic"\n\s+nodeUsageMode: "NORMAL"'
      - matchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: '(?s)- name: "generic".*?yaml: \|-\n.*?automountServiceAccountToken: false.*?- name: "deployer"'

  - it: gives only the EXCLUSIVE deployer template its deployment identity
    asserts:
      - matchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: '(?s)- name: "deployer".*?label: "jenkins-jenkins-deployer deployer"\n\s+nodeUsageMode: "EXCLUSIVE".*?serviceAccount: "jenkins-deployer"'
      - notMatchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: '(?s)- name: "deployer".*?label: "[^"\n]*jenkins-jenkins-agent'
      - matchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: '(?s)- name: "deployer".*?yaml: \|-\n.*?automountServiceAccountToken: true\n\s+securityContext:\n\s+runAsNonRoot: true\n\s+runAsUser: 1000'

  - it: adds no agent affinity by default
    asserts:
      - notMatchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: 'nodeAffinity'

  - it: applies jenkins.agentAffinity to both agent pod templates
    set:
      jenkins.agentAffinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [node-a, node-b]
    asserts:
      - matchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: '(?s)- name: "generic".*?yaml: \|-\n.*?runAsUser: 1000[^\n]*\n\s+affinity:[^\n]*\n\s+nodeAffinity:.*?- node-a\n\s+- node-b.*?- name: "deployer"'
      - matchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: '(?s)- name: "deployer".*?yaml: \|-\n.*?runAsUser: 1000\n\s+affinity:\n\s+nodeAffinity:.*?- node-a\n\s+- node-b'

  - it: uses the pinned kubectl tools container for the deployer
    asserts:
      - matchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: '(?s)- name: "deployer".*?- name: "kubectl"\n\s+alwaysPullImage: false\n\s+args: "infinity"\n\s+command: sleep.*?image: "alpine/k8s:1\.30\.14".*?runAsUser: 1000\n\s+ttyEnabled: false'

  - it: adds an EXCLUSIVE builder template with the builder label
    asserts:
      - matchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: '(?s)- name: "builder".*?label: "jenkins-jenkins-builder builder"\n\s+nodeUsageMode: "EXCLUSIVE"'
      - notMatchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: '(?s)- name: "builder".*?label: "[^"\n]*jenkins-jenkins-agent'

  - it: gives the builder no cluster token and no custom service account
    asserts:
      - matchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: '(?s)- name: "builder".*?yaml: \|-\n.*?automountServiceAccountToken: false'
      - matchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: 'label: "jenkins-jenkins-builder builder"\n(?:[^\n]*\n){3}\s+serviceAccount: "default"\n\s+slaveConnectTimeoutStr: "100"\n\s+yaml: \|-\n\s+apiVersion: v1\n\s+kind: Pod\n\s+spec:\n\s+automountServiceAccountToken: false\n\s+yamlMergeStrategy'

  - it: uses the pinned Kaniko debug container for the builder
    asserts:
      - matchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: '(?s)- name: "builder".*?- name: "kaniko"\n.*?command: /busybox/cat.*?image: "docker\.io/martizih/kaniko:v1\.28\.6-debug@sha256:7ab44d0131c3051b6dea128067e258c7afb5c4815082a93b9cf6c624f2140bf0".*?resourceLimitMemory: 4Gi\n\s+resourceRequestCpu: 10m\n\s+resourceRequestMemory: 1Gi\n\s+runAsUser: 0\n\s+ttyEnabled: true'

  - it: applies jenkins.agentAffinity to the builder template
    set:
      jenkins.agentAffinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: kubernetes.io/hostname
                    operator: In
                    values: [node-a, node-b]
    asserts:
      - matchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: '(?s)- name: "builder".*?yaml: \|-\n.*?automountServiceAccountToken: false\n\s+affinity:\n\s+nodeAffinity:.*?- node-a\n\s+- node-b'

  - it: keeps generic and deployer unchanged next to the builder
    asserts:
      - matchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: '(?s)templates:\n\s+- name: "generic".*?- name: "builder".*?- name: "deployer"'
      - matchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: '(?s)- name: "deployer".*?serviceAccount: "jenkins-deployer".*?automountServiceAccountToken: true\n\s+securityContext:\n\s+runAsNonRoot: true\n\s+runAsUser: 1000\n\s+yamlMergeStrategy'

  - it: keeps both templates in one cloud with the NetworkPolicy agent pod label
    asserts:
      - matchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: 'podLabels:\n\s+- key: "jenkins/jenkins-jenkins-agent"\n\s+value: "true"'
      - matchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: '(?s)templates:\n\s+- name: "generic".*?- name: "deployer"'
      - notMatchRegex:
          path: data["jcasc-default-config.yaml"]
          pattern: '(?s)- kubernetes:.*?- kubernetes:'
