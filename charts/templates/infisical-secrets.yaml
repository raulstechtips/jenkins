{{- $entries := list -}}
{{- if .Values.oidc.enabled -}}
{{- $entries = append $entries (dict "name" "jenkins-oidc" "secretPath" .Values.oidc.secretPath "keys" (dict "clientId" "OIDC_CLIENT_ID" "clientSecret" "OIDC_CLIENT_SECRET")) -}}
{{- end -}}
{{- if .Values.github.enabled -}}
{{- $entries = append $entries (dict "name" "jenkins-github" "secretPath" .Values.github.secretPath "keys" (dict "appId" "GITHUB_APP_ID" "privateKey" "GITHUB_APP_PRIVATE_KEY" "webhookSecret" "GITHUB_WEBHOOK_SECRET")) -}}
{{- end -}}
{{- range concat $entries .Values.additionalSecrets }}
---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalStaticSecret
metadata:
  name: {{ .name }}
  namespace: {{ $.Release.Namespace }}
spec:
  infisicalAuthRef:
    name: {{ required "infisical.authRef.name is required when secret pulls are enabled" $.Values.infisical.authRef.name | quote }}
    namespace: {{ required "infisical.authRef.namespace is required when secret pulls are enabled" $.Values.infisical.authRef.namespace | quote }}
  syncOptions:
    refreshInterval: 60s
  sources:
    - projectSlug: {{ required "infisical.projectSlug is required when secret pulls are enabled" $.Values.infisical.projectSlug | quote }}
      environmentSlug: {{ required "infisical.environmentSlug is required when secret pulls are enabled" $.Values.infisical.environmentSlug | quote }}
      secretPath: {{ .secretPath | quote }}
  targets:
    - name: {{ .name }}
      namespace: {{ $.Release.Namespace }}
      kind: Secret
      creationPolicy: Owner
      metadata:
        {{- if .jenkinsCredential }}
        annotations:
          jenkins.io/credentials-description: {{ .jenkinsCredential.description | quote }}
        labels:
          jenkins.io/credentials-type: {{ .jenkinsCredential.type | quote }}
          {{- with .jenkinsCredential.scope }}
          jenkins.io/credentials-scope: {{ . | quote }}
          {{- end }}
        {{- else }}
        annotations: {}
        labels: {}
        {{- end }}
      template:
        engineVersion: v1
        data:
          {{- range $key, $remoteKey := .keys }}
          {{ $key }}: {{ printf "{{ .%s.Value }}" $remoteKey | quote }}
          {{- end }}
{{- end }}
