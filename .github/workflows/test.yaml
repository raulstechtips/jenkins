name: test

on:
  workflow_call:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  image:
    strategy:
      fail-fast: false
      matrix:
        # The cluster runs only amd64 nodes, so only the amd64 image is built.
        include:
          - arch: amd64
            runner: ubuntu-24.04
            helm_sha256: f8180838c23d7c7d797b208861fecb591d9ce1690d8704ed1e4cb8e2add966c1
            yq_sha256: 654d2943ca1d3be2024089eb4f270f4070f491a0610481d128509b2834870049
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      ARCH: ${{ matrix.arch }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install chart tools for the controller startup test
        env:
          HELM_SHA256: ${{ matrix.helm_sha256 }}
          YQ_SHA256: ${{ matrix.yq_sha256 }}
        run: |
          curl -fsSL -o "$RUNNER_TEMP/helm.tar.gz" \
            "https://get.helm.sh/helm-v3.18.4-linux-$ARCH.tar.gz"
          echo "$HELM_SHA256  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm-bin"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP/helm-bin" --strip-components=1 "linux-$ARCH/helm"
          echo "$RUNNER_TEMP/helm-bin" >> "$GITHUB_PATH"
          curl -fsSL -o "$RUNNER_TEMP/yq" \
            "https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_$ARCH"
          echo "$YQ_SHA256  $RUNNER_TEMP/yq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Prepare chart dependencies before the offline test
        run: |
          helm repo add jenkins https://charts.jenkins.io
          helm dependency build charts
      - name: Build the controller on its native architecture
        run: |
          docker buildx build --load --provenance=false \
            --platform "linux/$ARCH" \
            --tag "jenkins-controller:ci-$ARCH" \
            --file plugins/Dockerfile plugins/
      - name: Test controller startup without external network access
        run: bash tests/integration/controller/run.sh "jenkins-controller:ci-$ARCH"
      # Scan and publish these exact images. Do not rebuild after the startup test.
      - name: Save the tested image
        run: docker save --output "$RUNNER_TEMP/controller-$ARCH.tar" "jenkins-controller:ci-$ARCH"
      - name: Upload the tested image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: controller-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/controller-${{ matrix.arch }}.tar
          if-no-files-found: error
          compression-level: 1
          retention-days: 1

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Helm
        run: |
          curl -fsSL -o "$RUNNER_TEMP/helm.tar.gz" \
            https://get.helm.sh/helm-v3.18.4-linux-amd64.tar.gz
          echo "f8180838c23d7c7d797b208861fecb591d9ce1690d8704ed1e4cb8e2add966c1  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm-bin"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP/helm-bin" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/helm-bin" >> "$GITHUB_PATH"
      - name: Install Helm unit tests
        run: |
          curl -fsSL -o "$RUNNER_TEMP/helm-unittest.tgz" \
            https://github.com/helm-unittest/helm-unittest/releases/download/v0.3.1/helm-unittest-linux-amd64-0.3.1.tgz
          echo "93234ed2bdab79186105600578ae7139d7a5c648f9a94a36b01c61b38767880b  $RUNNER_TEMP/helm-unittest.tgz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm-unittest"
          tar -xzf "$RUNNER_TEMP/helm-unittest.tgz" -C "$RUNNER_TEMP/helm-unittest"
          # The archive holds the binary. Remove the hook that downloads it again.
          sed -i '/^hooks:/,$d' "$RUNNER_TEMP/helm-unittest/plugin.yaml"
          helm plugin install "$RUNNER_TEMP/helm-unittest"
      - name: Check the plugin lock
        run: bash plugins/lock.sh --check
      - name: Test and render the chart
        run: |
          helm repo add jenkins https://charts.jenkins.io
          helm dependency build charts
          helm lint --strict charts
          helm lint --strict charts -f charts/ci/all-on-values.yaml
          helm unittest charts
          helm template jenkins charts -n jenkins -f charts/ci/all-on-values.yaml > rendered.yaml
      # The scan workflow reads this render. It does not render the chart again.
      - name: Upload the rendered manifests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: rendered-manifests
          path: rendered.yaml
          if-no-files-found: error
          retention-days: 1
      # apiextensions.k8s.io/v1/CustomResourceDefinition: no published schema
      # in the default location or the datreeio CRDs catalog.
      - name: Check Kubernetes schemas
        run: |
          curl -fsSL -o "$RUNNER_TEMP/kubeconform.tar.gz" \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          echo "95f14e87aa28c09d5941f11bd024c1d02fdc0303ccaa23f61cef67bc92619d73  $RUNNER_TEMP/kubeconform.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/kubeconform.tar.gz" -C "$RUNNER_TEMP" kubeconform
          export PATH="$RUNNER_TEMP:$PATH"
          kubeconform -strict -summary -schema-location default -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' -skip InfisicalStaticSecret,InfisicalPushSecret,apiextensions.k8s.io/v1/CustomResourceDefinition rendered.yaml
      # The step prints only the file and the line, never the value.
      - name: No private keys
        run: |
          FOUND=$(git ls-files -z | xargs -0 grep -nIE \
            -e '-----BEGIN [A-Z ]*PRIVATE KEY-----' \
            | cut -d: -f1,2 || true)
          if [ -n "$FOUND" ]; then
            printf '%s\n' "$FOUND" | while IFS=: read -r F L; do
              echo "::error file=$F,line=$L::Remove this value. Private keys belong in Infisical."
            done
            exit 1
          fi
          echo "No private key found."
      - name: Lint the workflow and shell
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck
          curl -fsSL -o "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" .github/workflows/*.yaml
          shellcheck scripts/*.sh plugins/lock.sh tests/integration/controller/run.sh
