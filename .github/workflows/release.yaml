name: release

on:
  workflow_call:
    outputs:
      version:
        description: The matched controller image and chart version
        value: ${{ jobs.version.outputs.version }}
      image_digest:
        description: The published amd64 controller image digest
        value: ${{ jobs.image.outputs.digest }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
      - name: Install version tools
        run: |
          curl -fsSL -o "$RUNNER_TEMP/oras.tar.gz" \
            https://github.com/oras-project/oras/releases/download/v1.2.3/oras_1.2.3_linux_amd64.tar.gz
          echo "b4efc97a91f471f323f193ea4b4d63d8ff443ca3aab514151a30751330852827  $RUNNER_TEMP/oras.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/oras.tar.gz" -C "$RUNNER_TEMP" oras
          curl -fsSL -o "$RUNNER_TEMP/yq" \
            https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          echo "654d2943ca1d3be2024089eb4f270f4070f491a0610481d128509b2834870049  $RUNNER_TEMP/yq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Log in for the version baseline
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | oras login ghcr.io -u "$ACTOR" --password-stdin
      - name: Check and compute version
        id: version
        run: bash scripts/version.sh

  # Keep controller images: retained charts can still refer to their digests.
  # Retention removes old branch builds of the controller image together with the chart versions.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: version
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE: ghcr.io/raulstechtips/jenkins-controller
    outputs:
      digest: ${{ steps.publish.outputs.digest }}
    steps:
      - name: Download the tested and scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: controller-image-amd64
          path: ${{ runner.temp }}/images
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
      - name: Publish the tested amd64 image
        id: publish
        run: |
          test -n "$VERSION"
          docker load --input "$RUNNER_TEMP/images/controller-amd64.tar"
          test "$(docker image inspect jenkins-controller:ci-amd64 --format '{{.Architecture}}')" = amd64
          docker tag jenkins-controller:ci-amd64 "$IMAGE:$VERSION"
          docker push "$IMAGE:$VERSION"
          DIGEST=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -er '.digest')
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "digest=$DIGEST" >> "$GITHUB_OUTPUT"
          echo "$IMAGE:$VERSION@$DIGEST" >> "$GITHUB_STEP_SUMMARY"

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [version, image]
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
      IMAGE_DIGEST: ${{ needs.image.outputs.digest }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - name: Install Helm
        run: |
          curl -fsSL -o "$RUNNER_TEMP/helm.tar.gz" \
            https://get.helm.sh/helm-v3.18.4-linux-amd64.tar.gz
          echo "f8180838c23d7c7d797b208861fecb591d9ce1690d8704ed1e4cb8e2add966c1  $RUNNER_TEMP/helm.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/helm-bin"
          tar -xzf "$RUNNER_TEMP/helm.tar.gz" -C "$RUNNER_TEMP/helm-bin" --strip-components=1 linux-amd64/helm
          echo "$RUNNER_TEMP/helm-bin" >> "$GITHUB_PATH"
      - name: Install yq
        run: |
          curl -fsSL -o "$RUNNER_TEMP/yq" \
            https://github.com/mikefarah/yq/releases/download/v4.45.1/yq_linux_amd64
          echo "654d2943ca1d3be2024089eb4f270f4070f491a0610481d128509b2834870049  $RUNNER_TEMP/yq" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/yq"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Package the chart with the published image
        run: |
          test -n "$VERSION"
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          # Upstream 5.9.73 reads only image.tag; put the digest in that value.
          yq -i '
            .jenkins.controller.image.registry = "ghcr.io" |
            .jenkins.controller.image.repository = "raulstechtips/jenkins-controller" |
            .jenkins.controller.image.tag = (strenv(VERSION) + "@" + strenv(IMAGE_DIGEST))
          ' charts/values.yaml
          helm repo add jenkins https://charts.jenkins.io
          helm dependency build charts
          helm lint --strict charts
          helm package charts --version "$VERSION"
          NAME=$(yq '.name' charts/Chart.yaml)
          helm show chart "$NAME-$VERSION.tgz" | yq -e '.version == strenv(VERSION)'
          helm show values "$NAME-$VERSION.tgz" | yq -e '
            .jenkins.controller.image.registry == "ghcr.io" and
            .jenkins.controller.image.repository == "raulstechtips/jenkins-controller" and
            .jenkins.controller.image.tag == (strenv(VERSION) + "@" + strenv(IMAGE_DIGEST)) and
            .jenkins.controller.image.tag != ""
          '
          helm template jenkins "$NAME-$VERSION.tgz" | yq -e '
            select(.kind == "StatefulSet") |
            .spec.template.spec.containers[] |
            select(.name == "jenkins") |
            .image == ("ghcr.io/raulstechtips/jenkins-controller:" + strenv(VERSION) + "@" + strenv(IMAGE_DIGEST))
          '
      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$ACTOR" --password-stdin
      - name: Push and check the chart
        run: |
          NAME=$(yq '.name' charts/Chart.yaml)
          helm push "$NAME-$VERSION.tgz" oci://ghcr.io/raulstechtips/charts
          helm show chart "oci://ghcr.io/raulstechtips/charts/$NAME" --version "$VERSION"
          echo "oci://ghcr.io/raulstechtips/charts/$NAME:$VERSION" >> "$GITHUB_STEP_SUMMARY"
